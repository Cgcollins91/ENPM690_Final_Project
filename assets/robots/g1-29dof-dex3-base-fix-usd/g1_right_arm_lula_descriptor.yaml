api_version: 1.0

# The 7 right-arm joints — the solver's solution space.
# Order/names verified against robots/unitree.py G129_CFG_WITH_DEX3_BASE_FIX.init_state.
cspace:
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint

root_link: pelvis

# Default warm-start: arm at side, slight elbow bend (0.4 rad).
# right_elbow_joint range is [-1.0472, 2.0944]; 0.4 is in range and well-conditioned.
# All shoulder and wrist joints at 0.0: arm hanging straight down from the shoulder,
# palm forward (the zero pose implied by the URDF's joint axes — shoulder-pitch axis Y,
# elbow axis Y, roll axis X, pitch axis Y, yaw axis Z).
# Iterate this value if Case 2 (FK plausibility check) reports pos[2] outside [-1.0, 1.5] m.
default_q: [0.0, 0.0, 0.0, 0.4, 0.0, 0.0, 0.0]

# Every URDF revolute joint NOT in cspace must appear here so lula.load_robot() does not
# raise on an undefined joint. rule: fixed pins the joint at the given value for FK purposes.
# Lula does not move these joints; their values affect the right arm's base-frame FK only.
#
# Default-value sources:
#   - Legs and waist: robots/unitree.py G129_CFG_WITH_DEX3_BASE_FIX.init_state.joint_pos
#     (hip_pitch = -0.05, knee = 0.2, ankle_pitch = -0.15, everything else 0.0)
#   - Left arm: robots/unitree.py init_state — all zeros (arm at side)
#   - Hands (left + right): 0.0 for all 14 joints — verified open-hand position from URDF limits:
#       thumb_0: symmetric [-1.047, +1.047], 0 = neutral
#       thumb_1: left [−0.611, +1.047] / right [−1.047, +0.611], 0 = between-limits open position
#       thumb_2: left [0, +1.745] lower-bound / right [−1.745, 0] upper-bound → 0 = open limit
#       index_0/middle_0: left [−π/2, 0] upper-bound / right [0, π/2] lower-bound → 0 = open limit
#       index_1/middle_1: left [−1.745, 0] / right [0, +1.745] → 0 = open limit
#     The left/right hands are mirror images: left curls negative, right curls positive, but both
#     rest at 0.0 in the open (uncurled) configuration. Matches robots/unitree.py init_state.

cspace_to_urdf_rules:

  # -----------------------------------------------------------------------
  # Left leg — standing pose (from robots/unitree.py init_state)
  # -----------------------------------------------------------------------
  - {name: left_hip_yaw_joint,      rule: fixed, value:  0.0}
  - {name: left_hip_roll_joint,     rule: fixed, value:  0.0}
  - {name: left_hip_pitch_joint,    rule: fixed, value: -0.05}
  - {name: left_knee_joint,         rule: fixed, value:  0.2}
  - {name: left_ankle_pitch_joint,  rule: fixed, value: -0.15}
  - {name: left_ankle_roll_joint,   rule: fixed, value:  0.0}

  # -----------------------------------------------------------------------
  # Right leg — standing pose (from robots/unitree.py init_state)
  # -----------------------------------------------------------------------
  - {name: right_hip_yaw_joint,     rule: fixed, value:  0.0}
  - {name: right_hip_roll_joint,    rule: fixed, value:  0.0}
  - {name: right_hip_pitch_joint,   rule: fixed, value: -0.05}
  - {name: right_knee_joint,        rule: fixed, value:  0.2}
  - {name: right_ankle_pitch_joint, rule: fixed, value: -0.15}
  - {name: right_ankle_roll_joint,  rule: fixed, value:  0.0}

  # -----------------------------------------------------------------------
  # Waist — upright torso (from robots/unitree.py init_state)
  # -----------------------------------------------------------------------
  - {name: waist_yaw_joint,         rule: fixed, value:  0.0}
  - {name: waist_roll_joint,        rule: fixed, value:  0.0}
  - {name: waist_pitch_joint,       rule: fixed, value:  0.0}

  # -----------------------------------------------------------------------
  # Left arm — arm at side, all zeros (from robots/unitree.py init_state)
  # -----------------------------------------------------------------------
  - {name: left_shoulder_pitch_joint, rule: fixed, value: 0.0}
  - {name: left_shoulder_roll_joint,  rule: fixed, value: 0.0}
  - {name: left_shoulder_yaw_joint,   rule: fixed, value: 0.0}
  - {name: left_elbow_joint,          rule: fixed, value: 0.0}
  - {name: left_wrist_roll_joint,     rule: fixed, value: 0.0}
  - {name: left_wrist_pitch_joint,    rule: fixed, value: 0.0}
  - {name: left_wrist_yaw_joint,      rule: fixed, value: 0.0}

  # -----------------------------------------------------------------------
  # Left hand — open-hand position (0.0 = open for all joints; see header note)
  # -----------------------------------------------------------------------
  - {name: left_hand_thumb_0_joint,  rule: fixed, value: 0.0}
  - {name: left_hand_thumb_1_joint,  rule: fixed, value: 0.0}
  - {name: left_hand_thumb_2_joint,  rule: fixed, value: 0.0}
  - {name: left_hand_middle_0_joint, rule: fixed, value: 0.0}
  - {name: left_hand_middle_1_joint, rule: fixed, value: 0.0}
  - {name: left_hand_index_0_joint,  rule: fixed, value: 0.0}
  - {name: left_hand_index_1_joint,  rule: fixed, value: 0.0}

  # -----------------------------------------------------------------------
  # Right hand — open-hand position (0.0 = open for all joints; see header note)
  # -----------------------------------------------------------------------
  - {name: right_hand_thumb_0_joint,  rule: fixed, value: 0.0}
  - {name: right_hand_thumb_1_joint,  rule: fixed, value: 0.0}
  - {name: right_hand_thumb_2_joint,  rule: fixed, value: 0.0}
  - {name: right_hand_middle_0_joint, rule: fixed, value: 0.0}
  - {name: right_hand_middle_1_joint, rule: fixed, value: 0.0}
  - {name: right_hand_index_0_joint,  rule: fixed, value: 0.0}
  - {name: right_hand_index_1_joint,  rule: fixed, value: 0.0}
